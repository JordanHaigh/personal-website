name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Configure GitHub Pages
        # Enable Pages with Source = GitHub Actions in repository settings first.
        uses: actions/configure-pages@v6

      - name: Install, test and build website
        run: |
          npm ci
          npm test
          npm run build
          test -s dist/index.html
          test -s dist/cv.html
          test -s dist/Jordan-Haigh-CV.pdf
          test -s dist/404.html
          test "$(cat dist/CNAME)" = "jordanhaigh.dev"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
